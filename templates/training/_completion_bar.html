{% if rate != None %}<div class="completion-bar" role="meter" aria-label="{{ bar_label|default:'Assignment completion' }}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ rate|floatformat:1 }}"><span style="width:{{ rate|floatformat:1 }}%"></span></div><span>{{ rate|floatformat:-1 }}% · {{ completed }}/{{ total }}</span>{% else %}<span>— {% if not total %}<small>No assignments</small>{% endif %}</span>{% endif %}
