<label class="option-label" for="rank-{{ option.id }}">Correct order for option {{ forloop.counter }}</label>
<input class="option-rank" id="rank-{{ option.id }}" type="number" min="1" max="20" step="1" name="rank_{{ question.id }}" value="{{ option.rank }}"
       {% if option.error %}aria-invalid="true" aria-describedby="option-error-{{ option.id }}"{% endif %}>
