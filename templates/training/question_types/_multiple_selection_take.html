<p class="quiz-answer-instruction">Select every answer that applies.</p>
{% for option in question.options %}
  <label class="choice"><input type="checkbox" name="{{ question.field_name }}" value="{{ option.value }}"
    {% if option.selected %}checked{% endif %} {% if question.error %}aria-invalid="true" aria-describedby="error-{{ question.id }}"{% endif %}>
    {{ option.text }}</label>
{% endfor %}
