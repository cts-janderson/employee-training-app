{% extends "training/base.html" %}
{% block title %}Reset password · Employee Training{% endblock %}
{% block content %}
  <h1>Reset your password</h1>
  <form class="card stack" method="post">
    {% csrf_token %}
    <div><label for="reset-email">Email</label><input id="reset-email" name="email" type="email" required autocomplete="email"></div>
    <div><button type="submit">Send reset link</button></div>
  </form>
  <p><a href="{% url 'sign_in' %}">Back to sign in</a></p>
{% endblock %}
