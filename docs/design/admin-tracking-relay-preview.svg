<svg class="relay-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="relay-title relay-description">
      <style>
        text { font-family: "Albert Sans", Arial, sans-serif; }
